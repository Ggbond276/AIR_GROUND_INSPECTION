server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: inspection-server

  # ---------------- MongoDB ----------------
  data:
    mongodb:
      uri: mongodb://localhost:27017/inspection
      database: inspection
      auto-index-creation: true

  # ---------------- Elasticsearch (v8 single-node, no security) ----------------
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 30s

  # ---------------- Kafka ----------------
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inspection-server
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        missing.topics.fatal: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false

# ---------------- 自定义业务配置 ----------------
inspection:
  kafka:
    topic:
      device-telemetry: device-telemetry
      device-tasks: device-tasks
      device-alerts: device-alerts

logging:
  level:
    root: INFO
    com.inspection.server: DEBUG
    org.springframework.kafka: INFO
    org.mongodb.driver: WARN
    # 想看 ES 客户端日志可解开下一行
    # org.springframework.data.elasticsearch.client.WIRE: TRACE
